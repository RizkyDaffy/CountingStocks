name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide IRIS SDK (file: dependency)
        run: |
          git clone --depth 1 --sparse https://github.com/RizkyDaffy/IRIS.git .iris-tmp
          git -C .iris-tmp sparse-checkout set SDK/JS

      - name: Compute image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          echo "IMAGE=ghcr.io/${OWNER,,}/counting-stock" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          {
            echo 'body<<__EOF__'
            node scripts/extract-changelog.js "${GITHUB_REF_NAME}"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
