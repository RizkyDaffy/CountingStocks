# Usage:
#   1. cp .env.example .env  →  fill in your values
#   2. docker compose up -d
#   3. First run only: docker compose exec counting-stock npm run migrate
#
# Services: counting-stock (Node/frontend+backend), db (MySQL 8)

services:
  # MySQL-compatible database for the app. Internal only (no host port
  # published, so it never fights XAMPP/other MySQL on 3306).
  db:
    image: mariadb:10.11
    container_name: counting-stock-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-outindb}
      # App user: root is localhost-only in modern MariaDB images,
      # the app/gate connect over the docker network so they need this user.
      MARIADB_USER: ${DB_USER:-counting}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Google Sheets microservice (BCP /backup). Internal only - the main API
  # proxies it via /api/bcp, so no host port is published.
  gsheet:
    image: ${GSHEET_IMAGE:-counting-stock-gsheet}
    build:
      context: ./microservices/google-sheet
      dockerfile: Dockerfile
    container_name: counting-stock-gsheet
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-18A9v3_zzugc0obDRY1BfvZliMsp4ceI0M6cFJRWpv9A}
      SHEETS_POLL_INTERVAL_MS: ${SHEETS_POLL_INTERVAL_MS:-5000}
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: /secrets/gsheet-key.json
    volumes:
      # Google service account key (never baked into the image).
      - ${GSHEET_KEY_PATH:-./brain/sugity-a4887dfc9882.json}:/secrets/gsheet-key.json:ro
    networks:
      - app-network

  counting-stock:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: counting-stock
    image: ${IMAGE:-counting-stock}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000" # Vite SSR / TanStack Start
      - "${API_PORT:-4000}:4000" # Express API
    environment:
      # Database - overridden by .env or docker compose --env-file
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-outindb}
      # API
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      VITE_INTERNAL_API_KEY: ${VITE_INTERNAL_API_KEY}
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://cstock.sugity.co.id}
      # Self-update ("Update Sekarang"): absolute path of this project on the Docker host.
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
      # Google Sheet microservice (BCP /backup) - service name inside the compose network.
      GSHEET_SERVICE_URL: ${GSHEET_SERVICE_URL:-http://gsheet:4002}
      # BCP stock sync poll (reads from the gsheet in-memory cache; 5s = seconds-level freshness)
      BCP_SYNC_INTERVAL_MS: ${BCP_SYNC_INTERVAL_MS:-5000}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-18A9v3_zzugc0obDRY1BfvZliMsp4ceI0M6cFJRWpv9A}
    networks:
      - app-network
      - nginx-public
    volumes:
      # Optional: mount .env at runtime (alternative to env vars above)
      # - ./.env:/app/.env:ro
      - app-logs:/app/logs
      # Self-update: lets the API spawn the one-shot updater container
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  app-logs:
    driver: local
  db-data:
    driver: local

networks:
  nginx-public:
    external: true
    name: nginx-public
  app-network:
    external: true
    name: henkaten-be_app-network
